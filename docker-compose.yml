services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: sonar-backend
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
      - ./docker/backend/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-sonar_advertising}
      DB_USERNAME: ${DB_USERNAME:-sonar_user}
      DB_PASSWORD: ${DB_PASSWORD:-sonar_password}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sonar-network

  nginx:
    image: nginx:alpine
    container_name: sonar-nginx
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8008}:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - sonar-network

  frontend:
    build:
      context: ./sonar-advertising
      dockerfile: ../docker/frontend/Dockerfile
    container_name: sonar-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./sonar-advertising:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5174}:5174"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8008/api}
    networks:
      - sonar-network

  db:
    image: mysql:8.0
    container_name: sonar-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sonar_advertising}
      MYSQL_USER: ${DB_USERNAME:-sonar_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sonar_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - sonar_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sonar-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: sonar-phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8082}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sonar-network

networks:
  sonar-network:
    driver: bridge

volumes:
  sonar_db_data:
    driver: local
